name: Release Android APK & Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & build web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../FoundryDesk-android-debug.apk

      - name: Package Chrome Extension ZIP
        run: npm run package:extension

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FoundryDesk-android-debug.apk
            dist/extension/*.zip
          generate_release_notes: true
