<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a11" />
    <meta name="description" content="SOCIALKILLER replaces the middleman agency model—giving solo creators 100% of their margin with audience insights, social channels, and campaigns in one local-first workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="./branding/favicon.png" />

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator && !['127.0.0.1', 'localhost'].includes(location.hostname)) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}))
      }
    </script>
  </body>
